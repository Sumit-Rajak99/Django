{% extends "base.html" %}
{% load static %}

{% block title %}Messages{% endblock title %}

{% block css %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    background-color: #f5f6fa;
  }
  .message-wrapper {
    max-width: 800px;
    margin: auto;
  }
</style>
{% endblock css %}

{% block content %}
<div class="container py-5">
  <div class="message-wrapper">

    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white">
        <h5 class="mb-0">Send Message</h5>
      </div>

      <div class="card-body">
        <form method="post">
          {% csrf_token %}

          <!-- Receiver -->
          <div class="mb-3">
            <label class="form-label">Receiver Email</label>
            <input type="email" name="receiver" class="form-control" placeholder="Enter Email here" required>
          </div>

          <!-- Subject -->
          <div class="mb-3">
            <label class="form-label">Subject</label>
            <input type="text" name="subject" class="form-control" placeholder="Enter subject" required>
          </div>

          <!-- Message -->
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea name="message" rows="6" class="form-control" placeholder="Write your message here..." required></textarea>
          </div>

          <!-- Buttons -->
          <div class="d-flex justify-content-end gap-2">
            <button type="reset" class="btn btn-outline-secondary">Clear</button>
            <button type="submit" class="btn btn-primary">Send Message</button>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>
{% endblock content %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

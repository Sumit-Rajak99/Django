{% extends "base.html" %}
{% load static %}
{% block title %}
Query

{% endblock title %}
{% block css %}

{% endblock css %}
{% block content %}

<form action="{% url 'query' %}" method="post" class="container mt-4">

{% csrf_token %}
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input type="text" name="name" class="form-control" placeholder="Enter your name" value="{{data.name}}" readonly>
  </div>

  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" name="email" class="form-control" placeholder="Enter your email" value="{{data.email}}" readonly>
  </div>

  <div class="mb-3">
    <label class="form-label">Query</label>
    <input type="text" name="query" class="form-control" placeholder="Enter your query">
  </div>

  <div class="mb-3">
    <label class="form-label">Department</label>
    
      <select class="form-select" name="department" required>
       {% for i in all_dep %}
         <option value="{{ i.d_name }}">{{ i.d_name }}</option>
        {% endfor %}
                    
         </select>
  </div>

  <button type="submit" class="btn btn-primary">
    Submit Query
  </button>

</form>


{% endblock content %}
{% block js %}

{% endblock js %}
